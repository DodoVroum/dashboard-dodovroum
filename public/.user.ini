; Relève les limites PHP par défaut (souvent 2M) qui rejettent silencieusement
; les uploads de photos avant même que la validation Laravel ne s'exécute.
; Effectif automatiquement sous PHP-FPM (pas de redémarrage requis, voir
; user_ini.cache_ttl — jusqu'à 5 minutes de délai de prise en compte).
upload_max_filesize = 8M
post_max_size = 10M
